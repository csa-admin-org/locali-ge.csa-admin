name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Production
    if: >-
      github.repository == 'csa-admin-org/locali-ge.csa-admin' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: production

    env:
      APPSIGNAL_PUSH_API_KEY: ${{ secrets.APPSIGNAL_PUSH_API_KEY }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
      COCAGNE_API_TOKEN: ${{ secrets.COCAGNE_API_TOKEN }}
      LEJARDINDEMAX_API_TOKEN: ${{ secrets.LEJARDINDEMAX_API_TOKEN }}
      FILIEREALIMENTAIRE_API_TOKEN: ${{ secrets.FILIEREALIMENTAIRE_API_TOKEN }}
      TOUVIERE_API_TOKEN: ${{ secrets.TOUVIERE_API_TOKEN }}
      ORTIE_API_TOKEN: ${{ secrets.ORTIE_API_TOKEN }}
      LEPETRICHOR_API_TOKEN: ${{ secrets.LEPETRICHOR_API_TOKEN }}
      CULTURESLOCALES_API_TOKEN: ${{ secrets.CULTURESLOCALES_API_TOKEN }}

    steps:
      - name: Check secrets
        env:
          KAMAL_SSH_PRIVATE_KEY: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}
        run: |
          missing=
          for name in \
            KAMAL_SSH_PRIVATE_KEY \
            APPSIGNAL_PUSH_API_KEY \
            WEBHOOK_SECRET \
            COCAGNE_API_TOKEN \
            LEJARDINDEMAX_API_TOKEN \
            FILIEREALIMENTAIRE_API_TOKEN \
            TOUVIERE_API_TOKEN \
            ORTIE_API_TOKEN \
            LEPETRICHOR_API_TOKEN \
            CULTURESLOCALES_API_TOKEN
          do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Missing GitHub Environment secrets on 'production':$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Bootstrap
        uses: jdx/mise-action@v4
        with:
          bootstrap: true
          cache_key: "{{default}}-${{ hashFiles('Gemfile.lock') }}"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Trust isle
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          {
            echo "Host *"
            echo "  StrictHostKeyChecking no"
            echo "  CheckHostIP no"
            echo "  UserKnownHostsFile /dev/null"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy
        run: |
          echo "Deploying $(git rev-parse HEAD)"
          bundle exec kamal deploy
